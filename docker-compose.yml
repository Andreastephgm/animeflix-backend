version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: animeflix-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: animeflix
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    container_name: animeflix-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/animeflix-backend
    depends_on:
      - mongodb

volumes:
  mongo_data: